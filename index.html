<!doctype html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>कर्मसाक्षी — कर्मसाक्षी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#faf6f1;--card:#fff;--ink:#241a17;--ink2:#4a3b36;--muted:#7a6a63;
--brand:#780b1a;--rule:#e7dcd1;--code:#f3ece4}
@media(prefers-color-scheme:dark){:root{--bg:#15100f;--card:#1d1614;--ink:#f2e8e2;
--ink2:#cbb9b1;--muted:#9a8880;--brand:#e4922b;--rule:#3a2c28;--code:#241c19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Noto Sans Devanagari","Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
line-height:1.85;font-size:17px}
main{max-width:760px;margin:0 auto;padding:32px 20px 80px}
h1{font-size:1.9rem;line-height:1.35;margin:.2em 0 .1em;color:var(--brand)}
h2{font-size:1.35rem;margin:2em 0 .4em;padding-top:.6em;border-top:1px solid var(--rule)}
h3{font-size:1.1rem;margin:1.6em 0 .3em}
p{margin:.7em 0;color:var(--ink2)}
strong{color:var(--ink)}
a{color:var(--brand)}
ul{padding-left:1.3em;color:var(--ink2)}
li{margin:.3em 0}
hr{border:0;border-top:1px solid var(--rule);margin:2.2em 0}
blockquote{margin:1em 0;padding:.7em 1em;border-left:3px solid var(--brand);
background:var(--card);border-radius:0 8px 8px 0;color:var(--ink2)}
code{background:var(--code);padding:.12em .4em;border-radius:5px;font-size:.9em}
.tw{overflow-x:auto;margin:1.1em 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--rule);padding:.55em .75em;text-align:left;vertical-align:top}
th{background:var(--card);font-weight:600}
.top{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:26px;font-size:.9rem}
.top a{text-decoration:none;padding:.45em .9em;border:1px solid var(--rule);
border-radius:999px;background:var(--card)}
footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--rule);
color:var(--muted);font-size:.85rem}</style>
</head>
<body>
<main>

</nav>

<h1>कर्मसाक्षी</h1>
<p>पण्डित, पुरोहित र ज्योतिषीका लागि कर्मकाण्ड, ज्योतिष, पञ्चाङ्ग र यजमान —
एउटै ठाउँमा।</p>

</ul>

<footer>कर्मसाक्षी · com.poojaaaja.karmasakshi</footer>
</main>
</body>
</html>
